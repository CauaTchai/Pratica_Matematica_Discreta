<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matemática Discreta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Matemática Discreta</h1>
        <p>Arthur Candido, Caua de Morais e Mateus Soier</p>
    </header>

    <main class="container">
        <!-- Euclides Estendido -->
        <div class="card">
            <div class="card-header">
                <span class="badge">MDC</span>
                <h2>Euclides Estendido</h2>
            </div>
            <div class="input-group">
                <input type="number" id="valorA" placeholder="Valor A">
                <input type="number" id="valorB" placeholder="Valor B">
                <button onclick="calcularEuclides()">Calcular</button>
            </div>
            <div id="resultadoEuclides" class="resultado-box hidden"></div>
            <div id="passosEuclides" class="passos-box hidden"></div>
        </div>

        <!-- Crivo de Eratóstenes -->
        <div class="card">
            <div class="card-header">
                <span class="badge">CE</span>
                <h2>Crivo de Eratóstenes</h2>
            </div>
            <div class="input-group">
                <input type="number" id="limiteN" placeholder="Limite n">
                <button onclick="calcularCrivo()">Filtrar Primos</button>
            </div>
            <div id="resultadoCrivo" class="resultado-box hidden"></div>
            <div id="passosCrivo" class="passos-box hidden"></div>
        </div>

        <!-- Calculadora de Bases -->
        <div class="card">
            <div class="card-header">
                <span class="badge">CB</span>
                <h2>Calculadora de Bases</h2>
            </div>
            <div class="input-group">
                <input type="text" id="numeroBase" placeholder="Número">
                <input type="number" id="baseOrigem" placeholder="Base Origem">
                <input type="number" id="baseDestino" placeholder="Base Destino">
                <button onclick="calcularBases()">Calcular</button>
            </div>
            <div id="resultadoBases" class="resultado-box hidden"></div>
            <div id="passosBases" class="passos-box hidden"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
